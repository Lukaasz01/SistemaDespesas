spring.application.name=rastreador-despesas
server.port=9000

# Habilitar o console H2
spring.h2.console.enabled=true

# Definir o caminho de acesso (padrao eh /h2-console)
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Segredo de assinatura do JWT.
# Em producao, defina a variavel de ambiente JWT_SECRET.
api.security.token.secret=${JWT_SECRET:segredo-apenas-para-desenvolvimento}
